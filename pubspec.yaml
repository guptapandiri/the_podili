name: e_shop
description: Flutter eCommerce App using Firebase Firestore from Coding Cafe

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.0
  cloud_firestore: ^5.6.0
  firebase_auth: ^5.3.3
  shared_preferences: ^2.3.3
  fluttertoast: ^8.2.8
  image_picker: ^1.1.2
  firebase_storage: ^12.3.7
  flutter_staggered_grid_view: ^0.7.0
  provider: ^6.1.2
  image: ^4.2.0
  razorpay_flutter: ^1.3.7
  twilio_flutter: ^0.0.5
  timeline_tile: ^2.0.0
  google_fonts: ^6.2.1
  weather_icons: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  new_version: ^0.3.1
  intl: ^0.19.0


dev_dependencies:
  flutter_test:
    sdk: flutter

flutter_icons:
  android: true
  ios: true
  image_path: "assets/podili_icon.png"


flutter:
  uses-material-design: true
  fonts:
    - family: Signatra
      fonts:
        - asset: assets/fonts/Signatra.ttf
    - family: GoblinOne
      fonts:
        - asset: assets/fonts/GoblinOne-Regular.ttf 

  assets:
    - images/welcome.png
    - images/login.png
    - images/admin.png
    - images/cash.png
    - images/logo.png
    - images/services.png
    - data/
    - assets/delivery/
    - assets/



